<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRFix - Fiche Équipement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <div class="flex items-center space-x-3 mb-6">
      <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center font-bold text-slate-900 text-xl">Q</div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">QRFix Passport</h1>
        <p class="text-xs text-slate-400" id="asset-id-display">Chargement...</p>
      </div>
    </div>

    <!-- Détails Équipement -->
    <div class="bg-slate-900/60 rounded-xl p-4 mb-6 border border-slate-700/50">
      <h2 class="text-lg font-semibold text-cyan-400" id="asset-name">Équipement</h2>
      <p class="text-sm text-slate-400 mt-1">Signalement direct</p>
      <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
        <span class="text-slate-400">Statut :</span>
        <span id="asset-status" class="bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-medium">Opérationnel</span>
      </div>
    </div>

    <!-- Formulaire Incident -->
    <div class="space-y-4">
      <label class="block text-sm font-medium text-slate-300">Description de la panne</label>
      <textarea id="incident-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500" placeholder="Ex: Alarme seringue, fuite..."></textarea>
      
      <button id="btn-submit" type="button" class="w-full bg-red-600 hover:bg-red-500 text-white font-medium py-3 rounded-xl transition duration-150 shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2">
        <span>🚨 Signaler la panne</span>
      </button>

      <p id="status-msg" class="hidden text-center text-sm font-medium mt-2"></p>
      <a id="btn-wa" target="_blank" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition duration-150 shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 mt-3">
        <span>Contacter sur WhatsApp</span>
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const assetId = urlParams.get('id') || urlParams.get('asset_id') || 'INCONNU';
    const companyCode = urlParams.get('company') || urlParams.get('company_code') || '';

    document.getElementById('asset-id-display').innerText = `ID: ${assetId}`;
    document.getElementById('asset-name').innerText = `Machine : ${assetId}`;

    const btn = document.getElementById('btn-submit');
    const descInput = document.getElementById('incident-desc');
    const statusMsg = document.getElementById('status-msg');
    const waBtn = document.getElementById('btn-wa');

    btn.addEventListener('click', async function() {
      const desc = descInput.value.trim();

      if (!desc) {
        alert("Veuillez saisir une description de la panne.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "📍 Recherche GPS en cours...";
      statusMsg.className = "text-center text-sm font-medium text-cyan-400 block mt-2";
      statusMsg.innerText = "Acquisition des coordonnées GPS...";

      let lat = null;
      let lng = null;
      let mapsUrl = null;

      // Récupération de la position GPS
      if (navigator.geolocation) {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(
              resolve, 
              reject, 
              { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
          });
          lat = position.coords.latitude;
          lng = position.coords.longitude;
          mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
        } catch (gpsError) {
          console.warn("Erreur ou refus GPS :", gpsError.message);
        }
      }

      btn.innerText = "⏳ Envoi en cours...";
      statusMsg.innerText = "Enregistrement dans la base de données...";

      try {
        const client = supabase.createClient(
          "https://vgvzsawpetlitxxzwhpu.supabase.co",
          "sb_publishable_LtOTN3w-rBdYduoUjBfhxg_Zzmz_su6"
        );

        const { error } = await client.from('incident_reports').insert([{
          asset_id: assetId,
          company_code: companyCode,
          description: desc,
          latitude: lat,
          longitude: lng,
          maps_url: mapsUrl,
          status: 'EN_ARRET'
        }]);

        if (error) {
          statusMsg.className = "text-center text-sm font-medium text-red-400 block mt-2";
          statusMsg.innerText = "Erreur Supabase : " + error.message;
          btn.disabled = false;
          btn.innerText = "🚨 Signaler la panne (avec GPS)";
        } else {
          statusMsg.className = "text-center text-sm font-medium text-emerald-400 block mt-2";
          statusMsg.innerText = "✅ Panne signalée avec GPS !";

          const waLocation = mapsUrl ? `\nPosition GPS: ${mapsUrl}` : "";
          const waText = encodeURIComponent(`🚨 Panne signalée sur ${assetId}\nEntreprise: ${companyCode}\nDescription: ${desc}${waLocation}`);
          waBtn.href = `https://wa.me/213555880897?text=${waText}`;
          waBtn.classList.remove('hidden');

          descInput.value = "";
          btn.innerText = "Signalé ✅";
        }
      } catch (err) {
        statusMsg.className = "text-center text-sm font-medium text-red-400 block mt-2";
        statusMsg.innerText = "Erreur inattendue : " + err.message;
        btn.disabled = false;
        btn.innerText = "🚨 Signaler la panne (avec GPS)";
      }
    });
  </script>
</body>
</html>
